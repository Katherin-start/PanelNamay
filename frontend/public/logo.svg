  <!-- "Namay" in red -->
  <text x="200" y="48" font-family="'Arial Black', 'Arial', sans-serif" font-weight="900" font-size="28" fill="#E63946">Namay</text>

  <!-- "ODONTOLOGÍA" pill -->
  <rect x="80" y="58" width="113" height="19" rx="9.5" fill="none" stroke="#1D3557" stroke-width="1.4"/>
  <text x="136.5" y="71.5" font-family="Arial, sans-serif" font-weight="700" font-size="9" fill="#1D3557" text-anchor="middle" letter-spacing="0.8">ODONTOLOGÍA</text>

  <!-- "INTEGRAL" pill -->
